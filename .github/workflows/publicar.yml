# Compila el instalador de Windows y lo deja en un borrador de release.
# Se ejecuta al subir una etiqueta como v0.1.0 (debe coincidir con la versión
# de tauri.conf.json) o a mano desde la pestaña Actions.
name: Publicar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        working-directory: src-tauri
        run: cargo test

      - name: Compilar instalador
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Respaldo de Videos v__VERSION__
          releaseBody: Descarga el archivo `Respaldo.de.Videos_*_x64-setup.exe` de la sección Assets.
          releaseDraft: true

      - name: Guardar instalador
        uses: actions/upload-artifact@v7
        with:
          name: instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
